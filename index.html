<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N-E-X-V-I-L-O</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f7f7;color:#111}
header{padding:24px;text-align:center;background:#111;color:white}
h1{margin:0;letter-spacing:4px}.wrap{max-width:1000px;margin:auto;padding:20px}
input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;margin-bottom:20px}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 12px #0001}
.card img{width:100%;height:190px;object-fit:cover;border-radius:12px;background:#eee}
button{background:#111;color:white;border:0;padding:12px 16px;border-radius:10px;cursor:pointer;width:100%}
.price{font-weight:bold;font-size:18px;margin:8px 0}
</style>
</head>
<body>
<header><h1>N-E-X-V-I-L-O</h1><p>Smart products. Simple shopping.</p></header>
<div class="wrap">
<input id="search" placeholder="Search products..." oninput="render()">
<div id="products"></div>
</div>
<script src="config.js"></script>
<script>
const defaults=[
{name:"Mini Food Bag Sealer",price:"₹299",image:"https://via.placeholder.com/500x400?text=Food+Bag+Sealer",meesho:""},
{name:"Motion Sensor LED Light",price:"₹399",image:"https://via.placeholder.com/500x400?text=Motion+LED",meesho:""},
{name:"Mini Electric Chopper",price:"₹499",image:"https://via.placeholder.com/500x400?text=Mini+Chopper",meesho:""}
];
function products(){return JSON.parse(localStorage.getItem("nexvilo_products")||"null")||defaults}
function render(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=products().filter(p=>(p.name||"").toLowerCase().includes(q)).map(p=>`
<div class="card"><img src="${p.image||''}" alt=""><h2>${p.name}</h2><div class="price">${p.price}</div><button onclick="order('${encodeURIComponent(p.name)}')">Order on WhatsApp</button></div>`).join("");
}
function order(name){
let n=(typeof WHATSAPP_NUMBER!=="undefined"?WHATSAPP_NUMBER:("918075945850");
let msg=encodeURIComponent("Hi N-E-X-V-I-L-O, I would like to order: "+decodeURIComponent(name));
location.href="https://wa.me/"+n+"?text="+msg;
}
render();
</script>
</body>
</html>
